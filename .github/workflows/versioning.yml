name: Versioning

# Gates every PR on a version bump + RELEASE-NOTES.md update + a clean build inside
# Kinora, which builds and ships this repository, and auto-tags v<version> on merge
# to main. The logic lives in Kinora's reusable workflow, shared with rpivid-codec.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  versioning:
    uses: rondoval/kinora/.github/workflows/component-versioning.yml@main
    with:
      source_dir_var: KINORA_VIDEOCODEC_SOURCE_DIR
      gates: tests/run.sh host -m gates
